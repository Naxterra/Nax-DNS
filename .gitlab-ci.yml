stages:
  - publish

publish-v0.5.1:
  stage: publish
  image: alpine:3.22
  variables:
    RELEASE_VERSION: "0.5.1"
    RELEASE_TAG: "v0.5.1"
    PACKAGE_NAME: "betterdns"
    GITHUB_RELEASE: "https://github.com/Naxterra/Better-DNS-Manager/releases/download/v0.5.1"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE == "Publish GitLab release package"'
  before_script:
    - apk add --no-cache curl
  script:
    - |
      set -eu
      files="BetterDNS-Setup-0.5.1-win-x64.exe BetterDNS-portable-0.5.1-win-x64.zip SHA256SUMS.txt"
      for file in $files; do
        curl --fail --location --retry 3 --output "$file" "$GITHUB_RELEASE/$file"
      done
      sha256sum --check SHA256SUMS.txt
      package_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${RELEASE_VERSION}"
      for file in $files; do
        curl --fail-with-body --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$file" "$package_url/$file"
      done
      description="BetterDNS 0.5.1 adds localhost UDP/TCP DNS, Windows service controls, the revised DNS Servers and Activity pages, strict DoH3 with no silent downgrade, German and English UI, and five-minute sustained-failure confirmation. Windscribe users must disable the account-level Unlock Streaming feature for HTTP/3."
      curl --fail-with-body --request POST --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --data-urlencode "name=BetterDNS 0.5.1" \
        --data-urlencode "tag_name=${RELEASE_TAG}" \
        --data-urlencode "description=${description}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      for file in $files; do
        curl --fail-with-body --request POST --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --data-urlencode "name=$file" \
          --data-urlencode "url=$package_url/$file" \
          --data-urlencode "link_type=package" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${RELEASE_TAG}/assets/links"
      done
