name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        shell: pwsh
        run: dotnet build BetterDns.slnx -c Release

      - name: Unit tests
        shell: pwsh
        run: dotnet test tests/BetterDns.Core.Tests/BetterDns.Core.Tests.csproj -c Release --no-build

      - name: Create self-contained package
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BetterDNS-win-x64
          path: artifacts/BetterDNS
          if-no-files-found: error
